<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
/* =====================================================================
   Suki Co. brand
   Primary:   Dark Blue #000080, Light Blue #f4f6fc / #d7dde4, Blue #395784, Light Azure #f2f7fb
   Secondary: Vivid Red #e0625a, Purple Blue #6e5a9e
   Fonts:     Lilita One (headings), Poppins (body)
   ===================================================================== */
:root {
  --navy: #000080;
  --navy-2: #10107a;
  --blue: #395784;
  --blue-soft: #8fa4c8;
  --light: #f4f6fc;
  --line: #d7dde4;
  --azure: #f2f7fb;
  --red: #e0625a;
  --purple: #6e5a9e;
  --ink: #1b1f3b;
  --muted: #5d6680;
  --green: #2f8a5b;
  --amber: #b7791f;
  --slate: #d7dde4;
  --radius: 14px;
  --shadow: 0 6px 24px rgba(16, 16, 122, .10);
  --head: 'Lilita One', 'Poppins', sans-serif;
  --body: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--azure); }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--head); font-weight: 400; color: var(--navy); letter-spacing: .3px; margin: 0 0 8px; line-height: 1.2; }
h1 { font-size: 28px; }
h2 { font-size: 20px; }
h3 { font-size: 17px; margin-top: 20px; }
a { color: var(--blue); }
.title { margin-top: 0; }
.sub { color: var(--muted); margin: 0 0 18px; }
.note { color: var(--muted); font-size: 13px; }
.grow { flex: 1; min-width: 0; }

/* ---- form fields ---------------------------------------------------- */
label { display: block; font-weight: 500; font-size: 14px; margin: 14px 0 6px; }
input, select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: #fff;
  border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(57, 87, 132, .18); }
textarea { min-height: 120px; resize: vertical; }
input[type=file] { padding: 8px; background: var(--light); }
input[type=checkbox] { width: auto; accent-color: var(--navy); }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.checks label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; }
.imgprev img { max-width: 220px; max-height: 220px; border-radius: 10px; margin-top: 8px; border: 1px solid var(--line); }

/* ---- buttons -------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: 600 14px var(--body); padding: 10px 18px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--blue); background: #fff; color: var(--blue);
  transition: background .15s, transform .05s;
}
.btn:hover { background: var(--light); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.navy:hover { background: #1a1a99; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.red:hover { background: #c94f47; }
.btn.steel { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--navy); }
.btn.ghost:hover { background: rgba(0, 0, 128, .07); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn.pill { border-radius: 999px; padding: 11px 36px; font-family: var(--head); font-weight: 400; font-size: 17px; letter-spacing: .5px; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--blue); text-decoration: underline; cursor: pointer; }

/* ---- messages ------------------------------------------------------- */
.msg { padding: 10px 12px; border-radius: 10px; margin: 12px 0; font-size: 14px; }
.msg:empty { display: none; }
.msg.err { background: #fde9e7; color: #8f2c25; }
.msg.info { background: #e8edf8; color: var(--blue); }
.msg.ok { background: #e3f4ea; color: #1f6b44; }

/* =====================================================================
   Gate (welcome, sign in, apply)
   ===================================================================== */
.gate {
  min-height: 100vh; display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(57, 87, 132, .55), rgba(16, 16, 122, .55)),
              var(--hero, linear-gradient(160deg, #6f86b3 0%, #3d5686 45%, #1d2a5c 100%));
  background-size: cover; background-position: center;
}
.hero-top { position: relative; background: #93a8cc; padding: 14px 24px 34px; }
.hero-top .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1100px; margin: 0 auto; }
.hero-top .wave { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 34px; display: block; }
.toplinks { display: flex; align-items: center; gap: 8px; font-family: var(--head); color: var(--navy); }
.toplinks button { background: none; border: 0; cursor: pointer; font: 400 16px var(--head); color: var(--navy); display: inline-flex; align-items: center; gap: 8px; padding: 4px; }
.toplinks button:hover { text-decoration: underline; }
.toplinks .sep { opacity: .8; }

.brand { display: flex; align-items: center; gap: 10px; font: 400 22px var(--head); color: var(--navy); }
.brand .logo { display: inline-flex; color: var(--navy); }
.brand .logo img { height: 44px; width: auto; display: block; }

.gate-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px 48px; }
.glass {
  width: 100%; max-width: 460px; background: rgba(244, 246, 252, .93);
  border-radius: 16px; padding: 28px 26px; box-shadow: 0 16px 40px rgba(0, 0, 40, .28);
  backdrop-filter: blur(6px);
}
.glass.wide { max-width: 560px; }
.welcome { text-align: center; }
.welcome h1 { font-size: 26px; margin-bottom: 22px; }

.roles { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; }
.rolepick { background: none; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; font: 500 14px var(--body); color: var(--navy); padding: 4px; border-radius: 16px; }
.rolepick .circle {
  width: 82px; height: 82px; border-radius: 50%; background: #0b0b14; color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, .25); transition: transform .15s, box-shadow .15s;
}
.rolepick .circle svg { width: 46px; height: 46px; }
.rolepick:hover .circle { transform: translateY(-2px); }
.rolepick[aria-pressed=true] .circle { background: var(--navy); box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--navy); }
.rolepick[aria-pressed=true] span { font-weight: 600; }
.rolepick:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.rolehint { min-height: 22px; margin: 18px 0 14px; font-size: 13px; color: var(--muted); }
.rolehint.warn { color: var(--red); font-weight: 500; }
.welcome .after { margin-top: 14px; font-size: 13px; color: var(--muted); }
.devlink { margin: 18px 0 0; font-size: 12px; }
.devlink .link { color: var(--muted); }
.authcard h1 { font-size: 24px; }
.backrow { margin-bottom: 8px; }

/* =====================================================================
   App shell (after sign in)
   ===================================================================== */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.side { background: var(--navy); color: #fff; padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
.side .brand { color: #fff; margin: 0 6px 22px; }
/* the logo is navy and green, so it sits on a white badge in the navy side menu */
.side .brand .logo { background: #fff; border-radius: 10px; padding: 4px 6px; }
.side .brand .logo img { height: 34px; }
#nav { display: flex; flex-direction: column; gap: 4px; }
#nav button {
  text-align: left; background: none; border: 0; color: #d7dde4; font: 500 14px var(--body);
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
}
#nav button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
#nav button.on { background: var(--light); color: var(--navy); font-weight: 600; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: #fff; border-bottom: 1px solid var(--line); }
.who { display: flex; flex-direction: column; line-height: 1.25; }
.content { padding: 24px; max-width: 1180px; width: 100%; }

/* ---- panels, cards, layout ------------------------------------------ */
.panel { background: #fff; border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.card { background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); border: 1px solid #e6eaf2; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; align-items: start; }
.shopgrid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: start; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; justify-content: space-between; }
.empty { padding: 26px; text-align: center; color: var(--muted); background: #fff; border: 1.5px dashed var(--line); border-radius: 12px; }

/* store tiles */
.store {
  display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer;
  background: #fff; border: 1px solid #e6eaf2; border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow);
  font: inherit; color: inherit; transition: transform .15s;
}
.store:hover { transform: translateY(-2px); border-color: var(--blue-soft); }
.thumb { width: 64px; height: 64px; border-radius: 12px; background: var(--light); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb.big { width: 100%; height: 130px; }

/* product rows + cart */
.prow { display: flex; align-items: center; gap: 12px; box-shadow: none; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--blue); background: #fff; color: var(--navy); font-size: 18px; cursor: pointer; }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.stepper span { min-width: 22px; text-align: center; font-weight: 600; }
.line { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.total { display: flex; justify-content: space-between; font: 400 20px var(--head); color: var(--navy); margin: 14px 0; }
.gcash { display: flex; flex-direction: column; gap: 2px; background: var(--light); box-shadow: none; }
.gcash .big { font: 400 22px var(--head); color: var(--navy); }

/* orders */
.ocard { margin-bottom: 12px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
.meta .note { margin-left: auto; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.proof { max-width: 160px; max-height: 160px; border-radius: 10px; border: 1px solid var(--line); display: block; }
.track { display: flex; gap: 4px; margin-top: 12px; }
.track span { flex: 1; font-size: 11px; text-align: center; padding: 6px 2px; border-radius: 6px; background: var(--light); color: var(--muted); }
.track span.on { background: var(--navy); color: #fff; }

/* badges */
.badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--light); color: var(--blue); border: 1px solid var(--line); white-space: nowrap; }
.s-placed, .s-new, .s-pending, .s-to-verify { background: #fdf3e1; color: var(--amber); border-color: #f3dfb8; }
.s-accepted, .s-picked-up, .s-on-the-way, .s-in-review { background: #ece8f6; color: var(--purple); border-color: #d9d1ee; }
.s-delivered, .s-verified, .s-active, .s-resolved, .s-approved { background: #e3f4ea; color: var(--green); border-color: #c4e6d2; }
.s-cancelled, .s-rejected, .s-suspended, .s-declined { background: #fde9e7; color: #b23b33; border-color: #f6cbc6; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat { background: #fff; border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); border-left: 5px solid var(--navy); display: flex; flex-direction: column; }
.stat span { font-size: 13px; color: var(--muted); }
.stat b { font: 400 28px var(--head); color: var(--navy); }

/* tables */
.tablewrap { overflow-x: auto; background: #fff; border-radius: 12px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; background: var(--navy); color: #fff; font-weight: 500; padding: 10px 12px; white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid #edf0f5; vertical-align: top; }
tr:nth-child(even) td { background: var(--azure); }

/* tabs + search */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font: 500 13px var(--body); padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; color: var(--blue); cursor: pointer; }
.tab.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.search { max-width: 260px; }

/* admin */
.appcard { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
.decide { display: flex; flex-direction: column; gap: 6px; }
.task { margin-bottom: 10px; box-shadow: none; }
.task .btn { margin-top: 8px; }
.task .num { font: 400 30px var(--head); color: var(--navy); }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* drawer + toast */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 40, .35); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: min(640px, 100vw); background: var(--azure);
  z-index: 50; transform: translateX(100%); transition: transform .25s; display: flex; flex-direction: column;
  box-shadow: -8px 0 30px rgba(0, 0, 40, .2); visibility: hidden;
}
.drawer.open { transform: none; visibility: visible; }
.drawer header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #fff; border-bottom: 1px solid var(--line); }
.drawer header h2 { margin: 0; }
.drawer .body { padding: 20px; overflow-y: auto; flex: 1; }
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60;
  background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 40, .3);
  max-width: calc(100vw - 32px); font-size: 14px;
}
#toast.bad { background: var(--red); }

/* ---- phones --------------------------------------------------------- */
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side, .main { min-width: 0; }
  .side { position: static; height: auto; padding: 12px; }
  .side .brand { margin-bottom: 10px; }
  #nav { flex-direction: row; overflow-x: auto; }
  #nav button { white-space: nowrap; }
  .content { padding: 16px; }
  .cols, .shopgrid { grid-template-columns: 1fr; }
  .hero-top { padding: 12px 16px 30px; }
  .brand { font-size: 19px; }
  .brand .logo img { height: 36px; }
  .roles { gap: 14px; }
  .rolepick .circle { width: 70px; height: 70px; }
  .appcard { flex-wrap: wrap; }
  .kv { grid-template-columns: 1fr; }
  .search { max-width: none; width: 100%; }
}
/* =====================================================================
   Kapartner (grocery partner) look, from the dashboard mockup
   ===================================================================== */
:root { --slate-2: #c9d1dc; }
.top { gap: 16px; }
.topright { display: flex; align-items: center; gap: 14px; margin-left: auto; }
.topsearch { flex: 1; max-width: 420px; margin: 0; display: flex; align-items: center; gap: 8px; background: var(--light); border-radius: 12px; padding: 0 12px; color: var(--navy); }
.topsearch input { border: 0; background: transparent; padding: 10px 0; box-shadow: none; }
.topsearch:focus-within { box-shadow: 0 0 0 3px rgba(57, 87, 132, .25); }
.bell { position: relative; background: none; border: 0; color: var(--navy); cursor: pointer; padding: 6px; border-radius: 10px; }
.bell:hover { background: rgba(0, 0, 128, .07); }
.bell .dot { position: absolute; top: 4px; right: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); border: 2px solid var(--slate-2); }

.role-grocery { background: var(--light); }
.role-grocery .side { background: var(--slate-2); color: var(--navy); display: flex; flex-direction: column; padding: 0 0 18px; }
.role-grocery .side .brand { margin: 0 0 14px; padding: 14px 10px; justify-content: center; border-bottom: 3px solid #fff; }
.role-grocery .side .brand .logo.full { background: none; padding: 0; }
.role-grocery .side .brand .logo.full img { height: 82px; }
.role-grocery #nav { padding: 0 0 0 8px; }
.role-grocery #nav button { font: 400 18px var(--head); color: var(--navy); letter-spacing: .3px; padding: 8px 18px; border-radius: 6px 0 0 6px; }
.role-grocery #nav button:hover { background: rgba(255, 255, 255, .5); color: var(--navy); }
.role-grocery #nav button.on { background: var(--blue); color: #fff; box-shadow: inset 0 0 0 1.5px var(--navy); }
.sidecard { margin: auto 18px 0; background: #fff; border-radius: 10px; padding: 20px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--navy); font-size: 13px; }
.role-grocery .top { background: var(--slate-2); border-bottom: 0; padding: 14px 32px; }
.role-grocery .topsearch { background: var(--light); }
.role-grocery .who b { font: 400 18px var(--head); color: var(--navy); }
.role-grocery .content { padding: 24px 22px; }

.kp-hello { font-size: 26px; margin-bottom: 2px; }
.kp-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin: 18px 0 20px; }
.kp-stat { display: flex; align-items: center; gap: 12px; background: var(--slate-2); border: 0; border-radius: 8px; padding: 14px 16px; cursor: pointer; color: var(--navy); font: inherit; text-align: left; transition: transform .15s; }
.kp-stat:hover { transform: translateY(-2px); }
.kp-stat svg { width: 44px; height: 44px; flex-shrink: 0; }
.kp-stat span { display: flex; flex-direction: column; align-items: center; flex: 1; }
.kp-stat em { font-style: normal; font-weight: 600; font-size: 15px; }
.kp-stat b { font: 600 22px var(--body); }
.kp-panel { background: var(--slate-2); border-radius: 8px; padding: 16px 20px; margin-bottom: 4px; position: relative; }
.kp-panel + .kp-panel { border-top: 3px solid #fff; border-radius: 0 0 8px 8px; }
.kp-panel h2 { font: 700 19px var(--body); margin: 0; }
.kp-pill { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 0; border-radius: 10px; padding: 6px 12px; font: 500 13px var(--body); color: var(--navy); }
.link-pill { cursor: pointer; padding: 7px 16px; }
.link-pill:hover { background: var(--light); }
.kp-chart { position: relative; }
.kp-chart svg { width: 100%; height: auto; display: block; }
.kp-chart .grid { stroke: #b3bdcb; stroke-width: 1; }
.kp-chart .axis { font: 400 11px var(--body); fill: #2c3550; }
.kp-chart .axis.future { fill: #7a8499; }
.kp-chart .line { fill: none; stroke: #3f6fe0; stroke-width: 2.5; stroke-linecap: round; }
.kp-chart .dot { fill: #3f6fe0; stroke: var(--slate-2); stroke-width: 2; }
.kp-chart .cross { stroke: var(--navy); stroke-width: 1; stroke-dasharray: 3 3; }
.kp-chart .hit { fill: transparent; cursor: crosshair; }
.kp-tip { position: absolute; transform: translate(-50%, -100%); background: var(--navy); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 8px; pointer-events: none; white-space: nowrap; }
.kp-table summary { cursor: pointer; font-size: 13px; color: var(--blue); margin-top: 6px; }
.kp-table .tablewrap { margin-top: 8px; }
.kp-recent { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.kp-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 2px 0 2px 26px; color: var(--navy); }
.kp-line .note { margin-left: 6px; }
.kp-status { background: #fff; border-radius: 10px; min-width: 140px; text-align: center; font-size: 13px; padding: 2px 12px; color: var(--navy); }

@media (max-width: 1000px) { .kp-stats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 820px) {
  .role-grocery .side { padding-bottom: 8px; }
  .role-grocery .side .brand { padding: 8px; margin-bottom: 8px; }
  .role-grocery .side .brand .logo.full img { height: 54px; }
  .role-grocery #nav { padding: 0 8px; }
  .role-grocery #nav button { border-radius: 6px; font-size: 16px; }
  .sidecard { display: none; }
  .top { flex-wrap: wrap; }
  .role-grocery .top { padding: 12px 16px; }
  .topsearch { order: 2; max-width: none; flex-basis: 100%; }
  .kp-stats { gap: 10px; }
  .kp-stat { padding: 10px; gap: 8px; }
  .kp-stat svg { width: 32px; height: 32px; }
  .kp-stat em { font-size: 13px; }
  .kp-line { padding-left: 0; flex-wrap: wrap; }
  .kp-status { min-width: 0; }
  .kp-chart { overflow-x: auto; }
  .kp-chart svg { min-width: 600px; }
}
</style>
<script>
/* =====================================================================
   Core: state, server calls, small helpers shared by every view

/* ---- server calls ------------------------------------------------- */
function call(fn, args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}
const apiPublic = (fn, ...args) => call(fn, args);
async function api(fn, ...args) {
  try {
    return await call(fn, [token, ...args]);
  } catch (e) {
    if (String(e && e.message).indexOf('SESSION_EXPIRED') > -1) signOut('Your session expired. Sign in again.');
    throw e;
  }
}
const configReady = apiPublic('getConfig').then(c => { CONFIG = c; }).catch(() => {});

/* ---- photos ------------------------------------------------------- */
const imgUrl = id => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w700';
const viewUrl = id => 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view';
function thumb(id, alt, plain) {
  const img = '<img class="proof" src="' + imgUrl(id) + '" alt="' + esc(alt) + '" referrerpolicy="no-referrer">';
  return plain ? img.replace('class="proof"', '') : '<a href="' + viewUrl(id) + '" target="_blank" rel="noopener">' + img + '</a>';
}
function pickImage(file, max) {
  max = max || 1000;
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('bad image'));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function imgField(id, label, capture) {
  IMGS[id] = '';
  return '<label for="' + id + '">' + label + '</label><input id="' + id + '" type="file" accept="image/*"' +
    (capture ? ' capture="environment"' : '') + ' onchange="onImg(\'' + id + '\', this)"><div class="imgprev" id="' + id + '-prev"></div>';
}
async function onImg(id, input) {
  const f = input.files && input.files[0];
  if (!f) { IMGS[id] = ''; $(id + '-prev').innerHTML = ''; return; }
  try {
    IMGS[id] = await pickImage(f);
    $(id + '-prev').innerHTML = '<img src="' + IMGS[id] + '" alt="Preview of the photo you picked">';
  } catch (e) {
    IMGS[id] = '';
    $(id + '-prev').innerHTML = '';
    toast('Could not read that photo. Pick another one.', true);
  }
}

function show(id) {
  current = id;
  document.querySelectorAll('.page').forEach(p => { p.hidden = p.id !== id; });
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  closeDrawer();
  run(id, false);
}
async function run(id, silent) {
  const fn = LOADERS[id];
  if (!fn) return;
  try { await fn(silent); }
  catch (e) { if (me && !silent) toast('Could not load this page. Check your connection and try again.', true); }
}
setInterval(() => {
  if (me && current && !document.hidden && !$('drawer').classList.contains('open')) run(current, true);
}, POLL_MS);

function openDrawer(title, html) {

let authRole = null, authMode = 'signin', pickedRole = null;

function renderRoles() {
  $('roles').innerHTML = Object.keys(ROLES).map(k =>
    '<button class="rolepick" aria-pressed="' + (pickedRole === k) + '" onclick="pickRole(\'' + k + '\')">' +
    '<span class="circle">' + ICONS[k] + '</span><span>' + ROLES[k].short + '</span></button>').join('');
  const h = $('roleHint');
  h.className = 'rolehint';
  h.textContent = pickedRole ? ROLES[pickedRole].desc : 'Tap who you are, then apply or log in.';
}
function pickRole(k) { pickedRole = k; renderRoles(); }
// Apply / Log in from the welcome card or the top bar. Needs a role picked first.
function goAuth(mode) {
  showRoles();

    const h = $('roleHint');

function showRoles() {

function authMsg(text, kind) {

function fld(id, label, type, extra) {

}
function areaSel(id, label) {

      '<p class="note">No account yet? <button class="link" onclick="openAuth(\'' + authRole + '\',\'apply\')">Apply as ' + r.title + '</button></p>';

async function submitSignin() {
  const u = $('f-user').value.trim(), p = $('f-pass').value;
  if (!u || !p) return authMsg('Enter your username and password.');
  $('authBtn').disabled = true;
  try {
    const r = await apiPublic('login', u, p, authRole);
    if (!r.ok) { authMsg(r.msg, r.pending ? 'info' : 'err'); return; }
    begin(r);
  } catch (e) {
    authMsg('Could not reach the server. Check your connection and try again.');
  } finally {
    const b = $('authBtn'); if (b) b.disabled = false;
  }
}

async function submitApply() {
  const v = id => ($(id) ? $(id).value.trim() : '');
  if ($('f-pass').value !== $('f-pass2').value) return authMsg('The two passwords do not match.');
  const a = { type: authRole, name: v('f-name'), phone: v('f-phone'), area: v('f-area'), address: v('f-address'),
              username: v('f-user'), password: $('f-pass').value };
  if (authRole === 'grocery') { a.business = v('f-biz'); a.gcashNo = v('f-gno'); a.gcashName = v('f-gname'); a.photo = IMGS['f-photo'] || ''; }
  if (authRole === 'toda') {
    a.todaName = v('f-toda'); a.plateNo = v('f-plate'); a.photo = IMGS['f-photo'] || '';
    a.route = Array.prototype.map.call(document.querySelectorAll('input[name=route]:checked'), x => x.value);
  }
  $('authBtn').disabled = true;
  authMsg('Sending your application...', 'info');
  try {
    const r = await apiPublic('submitApplication', a);
    if (!r.ok) { authMsg(r.msg); $('authBtn').disabled = false; return; }
    $('authBox').innerHTML = '<h1>Application sent</h1><div class="msg ok">The developer team will review it. Come back and sign in once you are approved.</div>' +
      '<p><button class="btn navy" onclick="showRoles()">Back to start</button></p>';
  } catch (e) {
    authMsg('Could not send your application. Check your connection and try again.');
    $('authBtn').disabled = false;
  }
}

async function devSignin() {
  const u = $('d-user').value.trim(), p = $('d-pass').value, k = $('d-key').value.trim();
  const m = $('devMsg');
  if (!u || !p || !k) { m.textContent = 'Enter your username, password and access key.'; return; }
  m.textContent = '';
  $('devBtn').disabled = true;
  try {
    const r = await apiPublic('adminLogin', u, p, k);
    if (!r.ok) { m.textContent = r.msg; return; }
    begin(r);
  } catch (e) {
    m.textContent = 'Could not reach the server. Check your connection and try again.';
  } finally {
    $('devBtn').disabled = false;
  }
}

/* =====================================================================
   Session
   ===================================================================== */
async function begin(r) {
  await configReady;
  token = r.token;
  me = { id: r.id, name: r.name, role: r.role, groceryId: r.groceryId || '' };
  try { sessionStorage.setItem('se', JSON.stringify(r)); } catch (e) { /* storage can be blocked */ }
  $('gate').hidden = true;
  $('app').hidden = false;
  const kp = me.role === 'grocery';
  $('app').className = 'app role-' + me.role;
  $('whoName').textContent = kp && r.owner ? r.owner : me.name;
  $('whoRole').textContent = kp ? me.name : ROLE_NAME[me.role];
  $('sideBrand').innerHTML = kp ? '<span class="logo full">' + LOGO_FULL + '</span>' : '<span class="logo">' + LOGO + '</span>Suki Co.';
  $('topSearch').hidden = !kp; $('topBell').hidden = !kp; $('sideCard').hidden = !kp;
  $('topQ').value = '';
  $('nav').innerHTML = NAV[me.role].map(n => '<button data-id="' + n[0] + '" onclick="show(\'' + n[0] + '\')">' + esc(n[1]) + '</button>').join('');
  $('repCat').innerHTML = CONFIG.categories.map(c => '<option>' + esc(c) + '</option>').join('');
  show(HOME[me.role]);
}

function signOut(msg) {
  if (token) { try { google.script.run.logout(token); } catch (e) { /* ignore */ } }
  token = null; me = null; current = null;
  try { sessionStorage.removeItem('se'); } catch (e) { /* ignore */ }
  closeDrawer();
  $('bellDot').hidden = true;
  $('app').hidden = true;
  $('gate').hidden = false;
  showRoles();
  if (msg) toast(msg);
}

/* ---- shared report page ------------------------------------------- */
function reportFor(orderId) {
  show('shared-report');
  $('repOrder').value = orderId || '';
}
async function sendReport() {
  const d = $('repDesc').value.trim();
  if (!d) return toast('Describe what went wrong.', true);
  $('repBtn').disabled = true;
  try {
    const r = await api('submitReport', { category: $('repCat').value, orderId: $('repOrder').value, description: d });
    if (r.ok) { toast('Report sent. The developer team will review it.'); $('repDesc').value = ''; $('repOrder').value = ''; }
    else toast(r.msg || 'Could not send the report.', true);
  } catch (e) {
    toast('Could not send the report. Try again.', true);
  } finally {
    $('repBtn').disabled = false;
  }
}

window.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.logo').forEach(el => { el.innerHTML = LOGO; });
  document.querySelectorAll('.usericon').forEach(el => { el.innerHTML = USER_ICON; });
  if (HERO_PHOTO_ID) $('gate').style.setProperty('--hero', 'url("' + imgUrl(HERO_PHOTO_ID).replace('w700', 'w1600') + '")');
  renderRoles();
  try {
    const saved = sessionStorage.getItem('se');
    if (saved) begin(JSON.parse(saved));
  } catch (e) { /* ignore */ }
});
</script>
